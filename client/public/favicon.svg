<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F298"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E231F"/>
      <stop offset="100%" stop-color="#051310"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#10B981" stroke-opacity="0.25"/>

  <!-- Graduation Cap -->
  <path d="M32 14L48 21L32 28L16 21L32 14Z" fill="url(#lhGrad)" filter="url(#glow)"/>
  <path d="M22 24.5V31C22 34 26.5 37 32 37C37.5 37 42 34 42 31V24.5" stroke="url(#lhGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Cap Tassel -->
  <path d="M44 23V29C44 29.8 44.5 30.5 45 31" stroke="#00F298" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stylized L & H Stem Structure -->
  <!-- Left 'L' leg -->
  <path d="M20 28V46C20 48.5 22 50.5 24.5 50.5H30C31.5 50.5 32 49 32 47.5V47.5C32 46 30.5 45 29 45H26.5C25.5 45 25 44.2 25 43V28C25 26.8 24 26 22.5 26C21 26 20 26.8 20 28Z" fill="url(#lhGrad)"/>

  <!-- Right 'H' stem -->
  <path d="M38 34V48C38 49.5 39 50.5 40.5 50.5C42 50.5 43 49.5 43 48V34C43 32.5 42 31.5 40.5 31.5C39 31.5 38 32.5 38 34Z" fill="#FFFFFF"/>

  <!-- Crossbar connecting to open book leaf -->
  <path d="M28 39H39" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sparkle Accent -->
  <path d="M49 19L50.5 22L53.5 23.5L50.5 25L49 28L47.5 25L44.5 23.5L47.5 22L49 19Z" fill="#FFFFFF"/>
</svg>
